<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="site_title">Mind Lab</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' fill='none'%3E%3Ccircle cx='50' cy='50' r='48' fill='%2334C759'/%3E%3Cpath d='M20 50 L35 50 L45 30 L55 70 L65 50 L80 50' stroke='white' stroke-width='8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <script src="lang.js"></script> 

    <style>
        /* 1. 强制 Body 背景纯白 */
        body { 
            background-color: #ffffff !important; 
            overflow-x: hidden; /* 防止水平滚动条 */
        }

        /* 2. 修复卡片被切断的核心代码 */
        /* 给所有父容器开启溢出显示，严禁裁剪 */
        .main-container, .quiz-list {
            overflow: visible !important;
            transform-style: preserve-3d !important;
        }

        /* 3. 给列表项加"保护垫"，防止卡片变大时撞墙 */
        ul.quiz-list li {
            display: block !important;
            padding: 10px !important;  /* 关键：四周留出10px空隙给阴影 */
            margin: -10px !important;  /* 修正padding带来的位移 */
            margin-bottom: 15px !important; /* 保持垂直间距 */
            overflow: visible !important;   /* 关键：允许内容超出 */
            position: relative !important;
            z-index: 1 !important;
        }

        /* 4. 卡片本体样式 */
        .quiz-link {
            display: block !important;
            position: relative !important;
            background: #fff !important;
            border: 1px solid #eee !important;
            border-radius: 12px !important;
            z-index: 10 !important;
            /* 启用硬件加速，防止渲染抖动 */
            transform: translate3d(0,0,0) !important;
            transition: all 0.25s cubic-bezier(0.25, 0.8, 0.25, 1) !important;
            /* 确保背景色不透明 */
            background-clip: padding-box !important;
        }

        /* 5. 鼠标悬停特效 (绿色边框 + 完整显示) */
        .quiz-link:hover {
            /* 🟢 苹果绿边框 */
            border-color: #34C759 !important;
            
            /* 🟢 稍微上浮 (带3D位移，防止被背景吞没) */
            transform: translateY(-5px) scale(1.02) translate3d(0,0,20px) !important;
            
            /* 🟢 绿色光晕阴影 */
            box-shadow: 0 10px 25px rgba(52, 199, 89, 0.3) !important;
            
            /* 🟢 层级设为最高，直接刺破所有遮挡 */
            z-index: 999999 !important;
        }

        /* 6. 粒子背景层 (悬浮在最上层但鼠标穿透) */
        #particles-js {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 999; /* 浮在内容上面 */
            pointer-events: none; /* 鼠标穿透，不挡点击 */
            background: transparent !important;
        }
    </style>
</head>
<body>
    <header class="site-header">
        <a href="index.html" class="site-logo">
            <span class="logo-text" data-i18n="site_title">Mind Lab</span>
        </a>

        <nav class="site-nav">
            <select id="lang-selector" onchange="changeLanguage(this.value)"></select>
        </nav>
    </header>

    <div class="main-container">
        <h1 data-i18n="list_title">Hot Quizzes</h1>
        <p data-i18n="footer_slogan">Explore your unknown self</p>
        
        <ul class="quiz-list" id="quiz-list-container">
            </ul>
    </div>

    <footer class="site-footer">
        <p class="copyright">© 2026 <strong data-i18n="site_title">Mind Lab</strong>. <span data-i18n="rights_reserved">All Rights Reserved</span></p>
        <p class="slogan" data-i18n="footer_slogan">Explore your unknown self</p>

        <div class="footer-links">
            <a href="javascript:void(0);" id="link-privacy" data-i18n="privacy">Privacy Policy</a>
            <a href="javascript:void(0);" id="link-terms" data-i18n="terms">Disclaimer</a>
            <a href="javascript:void(0);" id="link-contact" data-i18n="contact">Contact Us</a>
        </div>
    </footer>

    <div id="particles-js"></div>

    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>

    <script>
        particlesJS("particles-js", {
            "particles": {
                "number": { "value": 30, "density": { "enable": true, "value_area": 800 } },
                "color": { "value": "#4cd964" }, /* 🟢 苹果绿粒子 */
                "shape": { "type": "circle" },
                "opacity": {
                    "value": 0.6,
                    "random": true,
                    "anim": { "enable": true, "speed": 0.5, "opacity_min": 0.3, "sync": false }
                },
                "size": { "value": 6, "random": true },
                "line_linked": { "enable": false }, /* ❌ 关闭连线，防止变成蜘蛛网 */
                "move": {
                    "enable": true,
                    "speed": 1,
                    "direction": "top", /* 向上飘动 */
                    "random": true,
                    "straight": false,
                    "out_mode": "out",
                    "bounce": false
                }
            },
            "interactivity": {
                "detect_on": "window",
                "events": {
                    "onhover": { "enable": true, "mode": "bubble" },
                    "onclick": { "enable": false },
                    "resize": true
                },
                "modes": {
                    "bubble": { "distance": 200, "size": 10, "duration": 2, "opacity": 0.8 }
                }
            },
            "retina_detect": true
        });
    </script>

    <script src="script.js"></script>
</body>
</html>
