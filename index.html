<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="site_title">Mind Lab</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' fill='none'%3E%3Ccircle cx='50' cy='50' r='48' fill='%2334C759'/%3E%3Cpath d='M20 50 L35 50 L45 30 L55 70 L65 50 L80 50' stroke='white' stroke-width='8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <script src="lang.js"></script> 

    <style>
        /* 1. 粒子特效层：强制沉底 */
        #particles-js {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1 !important; /* 关键：放到最最底下，绝不挡卡片 */
            background-color: #f7f9fc !important; /* 浅淡背景色 */
        }
        
        /* 2. 网页主体：透明，为了漏出底下的粒子 */
        body { 
            background-color: transparent !important; 
        }

        /* 3. 防止方框被切断的核心修复 */
        .main-container, .quiz-list {
            overflow: visible !important; /* 严禁裁剪 */
            transform-style: preserve-3d !important;
        }

        /* 4. 给列表项加"保护垫"，防止阴影被切 */
        ul.quiz-list li {
            display: block !important;
            padding: 10px !important;  /* 留出空隙给变大的框 */
            margin: -10px !important;  /* 修正位置 */
            margin-bottom: 15px !important;
            overflow: visible !important;
            position: relative !important;
            z-index: 1 !important;
        }

        /* 5. 卡片样式：白色背景，盖住底下的粒子 */
        .quiz-link {
            display: block !important;
            position: relative !important;
            background: #fff !important; /* 必须是白色，不然字看不清 */
            border: 1px solid #eee !important;
            border-radius: 12px !important;
            transition: all 0.2s ease-in-out !important;
            z-index: 10 !important;
        }

        /* 6. 鼠标悬停：变回蓝色 + 完整显示 */
        .quiz-link:hover {
            /* 🔵 改回你想要的蓝色 */
            border-color: #007bff !important; 
            
            /* 上浮效果 */
            transform: translateY(-5px) scale(1.02) !important;
            
            /* 蓝色阴影 */
            box-shadow: 0 10px 25px rgba(0, 123, 255, 0.15) !important;
            
            /* 层级拉到最高，防止被上下卡片遮挡 */
            z-index: 9999 !important; 
        }
    </style>
</head>
<body>
    <header class="site-header">
        <a href="index.html" class="site-logo">
            <span class="logo-text" data-i18n="site_title">Mind Lab</span>
        </a>

        <nav class="site-nav">
            <select id="lang-selector" onchange="changeLanguage(this.value)"></select>
        </nav>
    </header>

    <div class="main-container">
        <h1 data-i18n="list_title">Hot Quizzes</h1>
        <p data-i18n="footer_slogan">Explore your unknown self</p>
        
        <ul class="quiz-list" id="quiz-list-container">
            </ul>
    </div>

    <footer class="site-footer">
        <p class="copyright">© 2026 <strong data-i18n="site_title">Mind Lab</strong>. <span data-i18n="rights_reserved">All Rights Reserved</span></p>
        <p class="slogan" data-i18n="footer_slogan">Explore your unknown self</p>

        <div class="footer-links">
            <a href="javascript:void(0);" id="link-privacy" data-i18n="privacy">Privacy Policy</a>
            <a href="javascript:void(0);" id="link-terms" data-i18n="terms">Disclaimer</a>
            <a href="javascript:void(0);" id="link-contact" data-i18n="contact">Contact Us</a>
        </div>
    </footer>

    <div id="particles-js"></div>
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script>
        particlesJS("particles-js", {
            "particles": {
                "number": { "value": 40, "density": { "enable": true, "value_area": 800 } },
                "color": { "value": "#66cc99" }, /* 绿色粒子 */
                "shape": { "type": "circle" },
                "opacity": { "value": 0.6, "random": true, "anim": { "enable": true, "speed": 0.5, "opacity_min": 0.3 } },
                "size": { "value": 5, "random": true },
                "line_linked": { "enable": false }, /* 无连线 */
                "move": { "enable": true, "speed": 1.5, "direction": "none", "random": true, "out_mode": "out" }
            },
            "interactivity": {
                "detect_on": "window", /* 必须是 window 才能全屏检测 */
                "events": {
                    "onhover": { "enable": true, "mode": "bubble" },
                    "onclick": { "enable": false },
                    "resize": true
                },
                "modes": {
                    "bubble": { "distance": 200, "size": 8, "duration": 2, "opacity": 0.8 }
                }
            },
            "retina_detect": true
        });
    </script>

    <script src="script.js"></script>
</body>
</html>
