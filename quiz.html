<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="site_title">Mind Lab</title>
    <link rel="stylesheet" href="style.css">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' fill='none'%3E%3Ccircle cx='50' cy='50' r='48' fill='%2334C759'/%3E%3Cpath d='M20 50 L35 50 L45 30 L55 70 L65 50 L80 50' stroke='white' stroke-width='8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <script src="lang.js"></script>
</head>
<body>
    <header class="site-header">
        <a href="index.html" class="site-logo">
            <span class="logo-text" data-i18n="site_title">Mind Lab</span>
        </a>
        <nav class="site-nav">
            <select id="lang-selector" onchange="changeLanguage(this.value)"></select>
            <a href="index.html" data-i18n="exit_nav" style="margin-left: 10px; font-size: 13px;">Exit</a>
        </nav>
    </header>

    <div class="main-container">
        <div id="start-screen">
            <h1 id="quiz-title" data-i18n="loading">Loading...</h1>
            <p id="quiz-desc" data-i18n="loading">Loading...</p>
            
            <button class="btn-primary" onclick="startQuiz()" data-i18n="start_btn">Start Quiz</button>
            
            <div style="margin-top: 20px;">
                <a href="index.html" style="color: #666; text-decoration: none;" data-i18n="back_home">← Back to Home</a>
            </div>
        </div>

        <div id="quiz-screen" style="display: none;">
            <div class="progress"><span id="progress-text">1/11</span></div>
            <h2 id="question-text">Question</h2>
            
            <div id="options-box">
                </div>

            <div class="control-box">
                <button id="prev-btn" class="btn-secondary" onclick="prevQuestion()" style="display: none;" data-i18n="prev_btn">Previous</button>
            </div>
        </div>

        <div id="result-screen" style="display: none;">
            <h2 data-i18n="result_title">Result</h2>
            <h1 id="result-title">Title</h1>
            <div id="result-desc">Desc</div>
            
            <div class="share-section">
                <p style="color:#999; font-size:14px;" data-i18n="share_label">Share to:</p>
                <div class="share-buttons">
                    <button class="btn-share copy" onclick="copyLink()" data-i18n="copy_btn">📋 Copy</button>
                    <button class="btn-share weibo" onclick="shareTo('weibo')">Weibo</button>
                    <button class="btn-share x" onclick="shareTo('x')">Twitter</button>
                    <button class="btn-share fb" onclick="shareTo('facebook')">Facebook</button>
                </div>
            </div>

            <button class="btn-primary" onclick="location.reload()" data-i18n="restart_btn">Retake</button>
            <div style="margin-top: 15px;">
                <a href="index.html" style="color: #007bff; text-decoration: none;" data-i18n="back_home">← Back to Home</a>
            </div>
        </div>
    </div>

    <footer class="site-footer">
        <p class="copyright">© 2026 <strong data-i18n="site_title">Mind Lab</strong>. <span data-i18n="rights_reserved">All Rights Reserved</span></p>
        <p class="slogan" data-i18n="footer_slogan">Explore your unknown self</p>

        <div class="footer-links">
            <a href="javascript:void(0);" id="link-privacy" data-i18n="privacy">Privacy</a>
            <a href="javascript:void(0);" id="link-terms" data-i18n="terms">Terms</a>
            <a href="javascript:void(0);" id="link-contact" data-i18n="contact">Contact</a>
        </div>
    </footer>

    <script src="script.js"></script>
<script src="particles.js"></script>
</body>

</html>
